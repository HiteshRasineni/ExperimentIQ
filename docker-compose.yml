version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: experimentiq-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  experimentiq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: experimentiq-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5000
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=experimentiq
      - LOG_LEVEL=info
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
